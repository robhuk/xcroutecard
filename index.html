<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ca123f">
  <meta name="description" content="Offline Route Card for recording diversion coverage and route history.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Route card</title>
  <style>
    :root{
      --xc-red:#ca123f;
      --xc-deep:#a72d48;
      --xc-cream:#f8efe3;
      --xc-paper:#ffffff;
      --xc-ink:#22242a;
      --xc-muted:#6d6e73;
      --xc-teal:#16707c;
      --xc-border:#e5dfd7;
      --green:#168342; --amber:#c78a00; --red:#ca123f;
      --shadow:0 10px 28px rgba(46,35,28,.12);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--xc-ink);background:linear-gradient(180deg,var(--xc-cream),#fff 40%) fixed}
    body{padding-bottom:env(safe-area-inset-bottom)}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .app{max-width:980px;margin:auto;padding:18px 16px 48px}
    header{background:linear-gradient(90deg,#ca123f,#ad163c);color:#fff;border-radius:0 0 28px 28px;box-shadow:var(--shadow);margin:-18px -16px 24px;padding:18px 20px 22px}
    .brand{display:flex;align-items:center;justify-content:space-between;gap:14px}
    .brand img{height:32px;max-width:52%;object-fit:contain;object-position:left center}
    .brand-copy{font-size:1.25rem;font-weight:800;letter-spacing:.01em}
    .subtitle{margin:6px 0 0;opacity:.86;font-size:.92rem}
    .top-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
    .btn{border:0;border-radius:12px;padding:12px 15px;font-weight:750;transition:.15s transform,.15s opacity;min-height:46px}
    .btn:active{transform:scale(.98)}
    .btn-light{background:#fff;color:var(--xc-red)}
    .btn-red{background:var(--xc-red);color:#fff}
    .btn-outline{background:#fff;border:1px solid var(--xc-border);color:var(--xc-ink)}
    .btn-dark{background:#272b32;color:#fff}
    .btn-ghost{background:transparent;color:var(--xc-red);border:1px solid rgba(202,18,63,.25)}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 20px}
    .metric{background:#fff;border:1px solid var(--xc-border);border-radius:var(--radius);padding:15px;box-shadow:0 5px 18px rgba(0,0,0,.04)}
    .metric b{display:block;font-size:1.55rem;line-height:1.1}
    .metric span{font-size:.78rem;color:var(--xc-muted)}
    .alert{display:none;background:#fff7d8;border:1px solid #f0cf70;color:#6f5200;border-radius:14px;padding:12px 14px;margin:0 0 18px}
    .alert.show{display:block}.alert-toggle{background:none;border:0;color:#6f5200;font-weight:800;padding:0;cursor:pointer;text-align:left;font:inherit}.alert-details{display:none;margin-top:10px;font-size:.88rem;line-height:1.5}.alert.expanded .alert-details{display:block}.alert-chevron{display:inline-block;margin-left:6px}
    .section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:24px 0 12px}
    h2{font-size:1.1rem;margin:0}
    .count{font-size:.82rem;color:var(--xc-muted)}
    .route-list{display:grid;gap:12px}
    .route{background:#fff;border:1px solid var(--xc-border);border-radius:18px;padding:16px;box-shadow:0 5px 18px rgba(0,0,0,.045)}
    .route-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .route-name{font-size:1.06rem;font-weight:800}
    .status{display:flex;align-items:center;gap:7px;font-size:.86rem;font-weight:800;white-space:nowrap}
    .dot{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:0 0 0 4px rgba(0,0,0,.04)}
    .status.green .dot{background:var(--green)} .status.amber .dot{background:#f0b400} .status.red .dot{background:var(--red)}
    .route-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;color:var(--xc-muted);font-size:.87rem}.days-elapsed{margin-top:13px;font-size:1rem;color:var(--xc-ink);font-weight:800}
    .route-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    .route-actions button{padding:9px 12px;border-radius:10px}
    .empty{padding:28px 16px;text-align:center;border:2px dashed var(--xc-border);border-radius:18px;color:var(--xc-muted);background:#fff}
    .admin{margin-top:34px;padding-top:22px;border-top:1px solid var(--xc-border)}
    .admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    dialog{border:0;border-radius:22px;box-shadow:0 22px 70px rgba(0,0,0,.28);padding:0;width:min(94vw,560px);color:var(--xc-ink)}
    dialog::backdrop{background:rgba(20,18,18,.55)}
    .dialog-body{padding:20px}
    .dialog-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
    .icon-btn{border:0;background:#f3f0ed;border-radius:10px;width:40px;height:40px;font-size:1.25rem}
    form{display:grid;gap:13px}
    label{display:grid;gap:7px;font-size:.9rem;font-weight:700;color:#000}
    input,select{width:100%;border:1px solid #d9d5cf;border-radius:11px;padding:13px;background:#fff;color:#000;min-height:48px}
    .hint{font-size:.78rem;color:var(--xc-muted);margin-top:-6px}
    .form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:5px}
    .history-list{display:grid;gap:10px}
    .history-item{padding:12px 0;border-bottom:1px solid #ece8e2}
    .history-item:last-child{border-bottom:0}
    .history-main{font-weight:750}
    .history-sub{color:var(--xc-muted);font-size:.85rem;margin-top:3px}
    .install-note{font-size:.8rem;color:#f5e6e9;align-self:center}
    .quick-plus{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:62px;height:62px;border:0;border-radius:50%;background:var(--xc-red);color:#fff;font-size:2.15rem;line-height:1;font-weight:400;box-shadow:0 10px 24px rgba(202,18,63,.35);z-index:20}.quick-plus:active{transform:scale(.96)}.hidden{display:none!important}
    @media(max-width:560px){.summary{gap:7px}.metric{padding:12px}.metric b{font-size:1.28rem}.brand img{height:26px}.admin-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <img src="xc-white-logo.png" alt="CrossCountry">
        <div class="brand-copy">Route card</div>
      </div>
      <p class="subtitle">Diversion coverage record</p>
    </header>

    <section class="summary" aria-label="Route summary">
      <div class="metric"><b id="totalCount">0</b><span>Routes</span></div>
      <div class="metric"><b id="amberCount">0</b><span>92–182 days</span></div>
      <div class="metric"><b id="redCount">0</b><span>183+ days</span></div>
    </section>

    <div id="reminderAlert" class="alert"></div>

    <div class="section-head">
      <div><h2>My route card</h2><div class="count">Days since each diversion was last covered</div></div>
      
    </div>
    <section id="routeList" class="route-list"></section>

    <section class="admin">
      <div id="editCardActions" style="margin-bottom:16px"><button id="editCardBtn" class="btn btn-red" style="width:100%">Edit route card</button></div>
      <div class="section-head"><div><h2>Route card administration</h2><div class="count">Manage routes, history and local backups</div></div></div>
      <div class="admin-grid">
        <button id="historyBtn" class="btn btn-outline">View all route history</button>
        <button id="pdfBtn" class="btn btn-outline">Export route card as PDF</button>
        <button id="backupBtn" class="btn btn-outline">Export backup</button>
        <label class="btn btn-outline" style="display:flex;align-items:center;justify-content:center;cursor:pointer">Import backup<input id="importInput" type="file" accept=".json,application/json" class="hidden"></label>
      </div>
    </section>
  </main>
  <button id="quickCoverageBtn" class="quick-plus" aria-label="Add coverage record">+</button>

  <dialog id="routeDialog">
    <div class="dialog-body">
      <div class="dialog-head"><h2 id="routeDialogTitle">Add route</h2><button class="icon-btn" data-close="routeDialog">×</button></div>
      <form id="routeForm">
        <input id="routeId" type="hidden">
        <label>Route name<input id="routeName" required maxlength="80" placeholder="e.g. Newcastle Forth Banks"></label>
        <div class="form-actions"><button type="button" class="btn btn-outline" data-close="routeDialog">Cancel</button><button class="btn btn-red" type="submit">Save route</button></div>
      </form>
    </div>
  </dialog>

  <dialog id="coverageDialog">
    <div class="dialog-body">
      <div class="dialog-head"><h2 id="coverageTitle">Record coverage</h2><button class="icon-btn" data-close="coverageDialog">×</button></div>
      <form id="coverageForm">
        <input id="coverageRouteId" type="hidden">
        <label>Route
          <select id="coverageRouteSelect" required></select>
        </label>
        <label>Date covered<input id="coverageDate" type="date" required></label>
        <label>Method
          <select id="coverageMethod" required>
            <option value="Diversion">Diversion</option>
            <option value="Booked job">Booked job</option>
            <option value="TAPS RR">TAPS RR</option>
            <option value="RR Day">RR Day</option>
            <option value="Engineering Diversion">Engineering Diversion</option>
            <option value="Other">Other</option>
          </select>
        </label>
        <label>Service headcode / TAPS<input id="coverageHeadcode" required maxlength="4" autocapitalize="characters" placeholder="1V50 or TAPS"></label>
        <div class="hint">Headcode format: number + letter + two numbers, or TAPS.</div>
        <div class="form-actions"><button type="button" class="btn btn-outline" data-close="coverageDialog">Cancel</button><button class="btn btn-red" type="submit">Save coverage</button></div>
      </form>
    </div>
  </dialog>

  <dialog id="historyDialog">
    <div class="dialog-body">
      <div class="dialog-head"><h2 id="historyTitle">Route history</h2><button class="icon-btn" data-close="historyDialog">×</button></div>
      <div id="historyList" class="history-list"></div>
    </div>
  </dialog>

<script>
const DEFAULT_ROUTES = ["Newcastle Forth Banks","Newcastle 'Bridges'","S&K","Adwick","Barnsley","Beighton","Rotherham","Erewash Valley","Whitacre/Coleshill PW","Lichfield /X-City"];
const STORAGE_KEY = "route-card-v1";

function todayLocal(){
  const d=new Date(); const off=d.getTimezoneOffset(); return new Date(d.getTime()-off*60000).toISOString().slice(0,10);
}
function load(){
  try{
    const x=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(x && Array.isArray(x.routes)) return x;
  }catch(e){}
  return {version:1,routes:DEFAULT_ROUTES.map(name=>({id:crypto.randomUUID(),name,history:[]}))};
}
let state=load();
let editMode=false;
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
function daysSince(dateStr){
  if(!dateStr) return null;
  const start=new Date(dateStr+"T00:00:00"); const now=new Date(todayLocal()+"T00:00:00");
  return Math.max(0,Math.floor((now-start)/86400000));
}
function latest(route){
  return [...route.history].sort((a,b)=>b.date.localeCompare(a.date))[0]||null;
}
function statusFor(days){
  if(days===null) return {key:"red",label:"Not yet covered"};
  if(days<=91) return {key:"green",label:"Under 91 days"};
  if(days<=182) return {key:"amber",label:"92–182 days"};
  return {key:"red",label:"183+ days"};
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function render(){
  const list=document.getElementById("routeList");
  const routes=[...state.routes].sort((a,b)=>a.name.localeCompare(b.name));
  document.getElementById("totalCount").textContent=routes.length;
  let amber=0,red=0,over91=[];
  list.innerHTML="";
  if(!routes.length){list.innerHTML='<div class="empty">No routes on your card. Add a route to begin.</div>';}
  routes.forEach(route=>{
    const last=latest(route), days=last?daysSince(last.date):null, status=statusFor(days);
    if(status.key==="amber") amber++;
    if(status.key==="red") red++;
    if(days===null || days>91) over91.push(route.name);
    const meta=last ? `Last covered: <b>${esc(last.date)}</b> · ${esc(last.method)} · ${esc(last.headcode)}` : "No coverage recorded yet";
    const dayText=days===null ? "Days elapsed: Not yet covered" : `Days elapsed: ${days}`;
    const el=document.createElement("article");
    el.className="route";
    el.innerHTML=`<div class="route-top"><div><div class="route-name">${esc(route.name)}</div><div class="route-meta">${meta}</div></div><div class="status ${status.key}"><span class="dot"></span>${status.label}</div></div>
      <div class="route-actions"><button class="btn btn-outline" data-history="${route.id}">History</button>${editMode?`<button class="btn btn-ghost" data-delete="${route.id}">Remove</button>`:""}</div>
      <div class="days-elapsed">${dayText}</div>`;
    list.appendChild(el);
  });
  document.getElementById("amberCount").textContent=amber;
  document.getElementById("redCount").textContent=red;
  const alert=document.getElementById("reminderAlert");
  if(over91.length){
    alert.classList.add("show"); alert.classList.remove("expanded");
    alert.innerHTML=`<button class="alert-toggle" type="button"><b>Reminder:</b> ${over91.length} route${over91.length===1?" is":"s are"} over 91 days since coverage. <span class="alert-chevron">⌄</span></button><div class="alert-details">${over91.map(name=>`• ${esc(name)}`).join("<br>")}</div>`;
    alert.querySelector(".alert-toggle").onclick=()=>{alert.classList.toggle("expanded");alert.querySelector(".alert-chevron").textContent=alert.classList.contains("expanded")?"⌃":"⌄";};
  } else {alert.classList.remove("show","expanded");alert.innerHTML="";}
}
function routeById(id){return state.routes.find(r=>r.id===id)}
function showRouteDialog(route){
  document.getElementById("routeDialogTitle").textContent=route?"Edit route":"Add route";
  document.getElementById("routeId").value=route?.id||"";
  document.getElementById("routeName").value=route?.name||"";
  document.getElementById("routeDialog").showModal();
}
function showCoverage(id){
  const select=document.getElementById("coverageRouteSelect");
  select.innerHTML=state.routes.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join("");
  const chosen=id||state.routes[0]?.id||"";
  if(!chosen){alert("Add a route to your route card first.");return;}
  select.value=chosen;
  document.getElementById("coverageRouteId").value=chosen;
  document.getElementById("coverageTitle").textContent="Add coverage record";
  document.getElementById("coverageDate").value=todayLocal();
  document.getElementById("coverageMethod").value="Diversion";
  document.getElementById("coverageHeadcode").value="";
  document.getElementById("coverageDialog").showModal();
}
function showHistory(id){
  const route=routeById(id), hist=[...route.history].sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById("historyTitle").textContent=route.name+" — history";
  document.getElementById("historyList").innerHTML=hist.length?hist.map(x=>`<div class="history-item"><div class="history-main">${esc(x.date)} · ${esc(x.method)}</div><div class="history-sub">${esc(x.headcode)}</div></div>`).join(""):'<div class="empty">No coverage history recorded.</div>';
  document.getElementById("historyDialog").showModal();
}
document.getElementById("quickCoverageBtn").onclick=()=>showCoverage(null);
document.getElementById("routeForm").onsubmit=e=>{
  e.preventDefault(); const id=document.getElementById("routeId").value, name=document.getElementById("routeName").value.trim();
  if(!name) return;
  if(id){routeById(id).name=name;} else state.routes.push({id:crypto.randomUUID(),name,history:[]});
  save(); render(); document.getElementById("routeDialog").close();
};
document.getElementById("coverageRouteSelect").addEventListener("change",e=>{
  document.getElementById("coverageRouteId").value=e.target.value;
});
document.getElementById("coverageHeadcode").addEventListener("input",e=>e.target.value=e.target.value.toUpperCase());
document.getElementById("coverageForm").onsubmit=e=>{
  e.preventDefault(); const id=document.getElementById("coverageRouteSelect").value, date=document.getElementById("coverageDate").value, method=document.getElementById("coverageMethod").value, headcode=document.getElementById("coverageHeadcode").value.trim().toUpperCase();
  if(!/^(TAPS|[0-9][A-Z][0-9]{2})$/.test(headcode)){alert("Enter a valid headcode such as 1V50, or TAPS.");return;}
  routeById(id).history.push({id:crypto.randomUUID(),date,method,headcode,createdAt:new Date().toISOString()});
  save(); render(); document.getElementById("coverageDialog").close(); checkNotifications();
};
document.getElementById("routeList").onclick=e=>{
  const b=e.target.closest("button"); if(!b)return;
  const id=b.dataset.cover||b.dataset.history||b.dataset.edit||b.dataset.delete; if(!id)return;
  if(b.dataset.cover)showCoverage(id);
  else if(b.dataset.history)showHistory(id);
  else if(b.dataset.delete && confirm(`Remove "${routeById(id).name}" from your route card? History for this route will also be removed from this device.`)){state.routes=state.routes.filter(r=>r.id!==id);save();render();}
};
function setupEditCardButton(){
  const actions=document.getElementById("editCardActions");
  actions.innerHTML=editMode
    ? '<div style="display:flex;gap:10px"><button id="addRouteInEditBtn" class="btn btn-outline" style="flex:1">+ Add route</button><button id="editCardBtn" class="btn btn-red" style="flex:1">Done editing</button></div>'
    : '<button id="editCardBtn" class="btn btn-red" style="width:100%">Edit route card</button>';
  document.getElementById("editCardBtn").onclick=()=>{
    editMode=!editMode;
    setupEditCardButton();
    render();
  };
  if(editMode) document.getElementById("addRouteInEditBtn").onclick=()=>showRouteDialog(null);
}
setupEditCardButton();
document.getElementById("historyBtn").onclick=()=>{
  const all=state.routes.flatMap(r=>r.history.map(h=>({...h,route:r.name}))).sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById("historyTitle").textContent="All route history";
  document.getElementById("historyList").innerHTML=all.length?all.map(x=>`<div class="history-item"><div class="history-main">${esc(x.date)} · ${esc(x.route)}</div><div class="history-sub">${esc(x.method)} · ${esc(x.headcode)}</div></div>`).join(""):'<div class="empty">No coverage history recorded.</div>';
  document.getElementById("historyDialog").showModal();
};
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).close());

function exportBackup(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}), a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="route-card-backup-"+todayLocal()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
document.getElementById("backupBtn").onclick=exportBackup;
document.getElementById("importInput").onchange=async e=>{
  const f=e.target.files[0]; if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    if(!data || !Array.isArray(data.routes))throw new Error();
    if(!confirm("Replace the current route card on this device with the imported backup?"))return;
    state=data;save();render();alert("Backup imported.");
  }catch(err){alert("That file is not a valid Route card backup.");}
  e.target.value="";
};

function exportPDF(){
  const rows=state.routes.map(r=>{
    const l=latest(r), d=l?daysSince(l.date):null, s=statusFor(d);
    return `<tr><td>${esc(r.name)}</td><td>${d===null?"Not covered":d+" days"}</td><td>${esc(s.label)}</td><td>${l?esc(l.date):"—"}</td><td>${l?esc(l.method):"—"}</td><td>${l?esc(l.headcode):"—"}</td></tr>`;
  }).join("");
  const history=state.routes.flatMap(r=>r.history.map(h=>({...h,route:r.name}))).sort((a,b)=>b.date.localeCompare(a.date))
    .map(h=>`<tr><td>${esc(h.date)}</td><td>${esc(h.route)}</td><td>${esc(h.method)}</td><td>${esc(h.headcode)}</td></tr>`).join("");
  const w=window.open("","_blank");
  if(!w){alert("Please allow pop-ups to export your Route card as a PDF.");return;}
  w.document.write(`<!doctype html><html><head><title>Route card — ${todayLocal()}</title><style>body{font-family:Arial,sans-serif;color:#222;padding:24px}.back{position:sticky;top:12px;margin-bottom:16px;background:#ca123f;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}h1{background:#ca123f;color:#fff;padding:18px;border-radius:12px}table{width:100%;border-collapse:collapse;margin:16px 0 30px}th,td{border:1px solid #ccc;padding:8px;text-align:left;font-size:12px}th{background:#f8efe3}@media print{body{padding:0}.back{display:none}h1{print-color-adjust:exact;-webkit-print-color-adjust:exact}}</style></head><body><button class="back" onclick="if(window.opener){window.opener.focus()}window.close()">← Back to Route card</button><h1>Route card</h1><p>Exported ${todayLocal()}</p><h2>Current route card</h2><table><thead><tr><th>Route</th><th>Days since covered</th><th>Status</th><th>Last date</th><th>Method</th><th>Headcode / TAPS</th></tr></thead><tbody>${rows||"<tr><td colspan='6'>No routes</td></tr>"}</tbody></table><h2>Route history</h2><table><thead><tr><th>Date</th><th>Route</th><th>Method</th><th>Headcode / TAPS</th></tr></thead><tbody>${history||"<tr><td colspan='4'>No history</td></tr>"}</tbody></table><script>window.onload=()=>window.print();window.onafterprint=()=>{if(window.opener)window.opener.focus();};<\/script></body></html>`);
  w.document.close();
}
document.getElementById("pdfBtn").onclick=exportPDF;


async function checkNotifications(){
  const overdue=state.routes.filter(r=>{const l=latest(r);const d=l?daysSince(l.date):null;return d===null||d>91});
  if(Notification.permission==="granted" && overdue.length && "serviceWorker" in navigator){
    const reg=await navigator.serviceWorker.ready;
    reg.showNotification("Route card reminder",{body:`${overdue.length} route${overdue.length===1?" is":"s are"} over 91 days since coverage.`,icon:"icon-192.png",badge:"icon-192.png",tag:"route-card-overdue"});
  }
}
if("serviceWorker" in navigator)navigator.serviceWorker.register("service-worker.js");
render();
setTimeout(async()=>{
  if("Notification" in window && Notification.permission==="default"){
    try{await Notification.requestPermission();}catch(e){}
  }
  checkNotifications();
},900);
</script>
</body>
</html>
